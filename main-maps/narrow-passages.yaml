# Narrow-passage map, 32x32.
#
# Editing guide:
# - Obstacles are sorted by x first, then y.
# - The shape is built from four vertical wall columns and three horizontal wall rows.
# - Door/gap cells are intentionally left out of the obstacle list so every open
#   area connects back to the rest of the map.
# - To widen a passage, remove nearby obstacle coordinates.
# - To add clutter, add isolated obstacle coordinates, then run:
#     python3 main-maps/visualize_map.py main-maps/narrow-passages.yaml
#
# Current wall pattern:
# - Vertical walls: x = 6, 12, 18, 24
# - Horizontal walls: y = 8, 16, 24
# - Free-space connectivity was checked after editing: no trapped open regions.
