# Open map, 32x32.
#
# Editing guide:
# - Obstacles are sorted by x first, then y.
# - Coordinates use [x, y], where x increases left-to-right and y increases bottom-to-top.
# - To make this map more open, remove obstacle coordinates.
# - To make this map more cluttered, add obstacle coordinates that are not already listed.
# - After editing, run:
#     python3 main-maps/visualize_map.py main-maps/open.yaml
#
# Map intent:
# - Sparse map with a small number of isolated obstacles.
# - Best for low-conflict routing and baseline scalability tests.
#
# Current stats:
# - Obstacles: 16 of 1024 cells (1.6% blocked)
# - Free cells: 1008
# - Reachable free cells from one flood fill: 1008
# - Unreachable free cells: 0
map:
    dimensions: [32, 32]
    obstacles:
    # x = 0..7
    - !!python/tuple [1, 29]
    - !!python/tuple [3, 10]
    - !!python/tuple [5, 26]

    # x = 8..15
    - !!python/tuple [8, 19]
    - !!python/tuple [13, 29]

    # x = 16..23
    - !!python/tuple [17, 3]
    - !!python/tuple [17, 7]
    - !!python/tuple [21, 11]
    - !!python/tuple [21, 14]

    # x = 24..31
    - !!python/tuple [24, 6]
    - !!python/tuple [24, 31]
    - !!python/tuple [26, 21]
    - !!python/tuple [29, 11]
    - !!python/tuple [29, 25]
    - !!python/tuple [30, 17]
    - !!python/tuple [30, 24]
